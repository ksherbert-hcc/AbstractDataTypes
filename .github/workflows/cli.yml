name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."
  Build-Docs:
    name: Build javadocs
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository to GitHub virtual machine
        uses: actions/checkout@v6
      - name: Check java version
        run: java -version
      - name: Build the javadocs
        run: javadoc -d docs -sourcepath src adt
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages



    #   - name: Deploy - Publish Javadoc
    #     uses: MathieuSoysal/Javadoc-publisher.yml@v3.0.2
    #     with:
    #     #   GITHUB_TOKEN:
    #       javadoc-branch: gh-pages
    #       java-version: 17
    #       target-folder: docs
    #       project: gradle
    #       custom-command: javadoc -d docs -sourcepath src -subpackages adt
  Run-Tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository to GitHub virtual machine
        uses: actions/checkout@v6
    #   - uses: actions/setup-java@v4
        # with:
        #   java-version: 15
      - name: Check java version
        run: java -version
      - name: Run the Test.java file
        run: java -cp lib/* -ea src/Test.java