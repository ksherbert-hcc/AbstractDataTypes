name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Build-Docs:
    name: Build javadocs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository to GitHub virtual machine
        uses: actions/checkout@v6
    #   - uses: actions/setup-java@v4
    #     with:
    #       java-version: 15
    # Typically one would have to set up a java environment, but GitHub virtual machines come preloaded with one that seems to work.
      - name: Build the javadocs in docs directory
        run: javadoc -d docs -sourcepath src adt
      - name: Deploy the docs directory to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
  Run-Tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Install a compatible Java environment to GitHub's virtual machine.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Check java version.
        run: java -version
      - name: Clone this repository to GitHub's virtual machine.
        uses: actions/checkout@v6
      - name: Run the project's Test.java file.
        run: java -cp lib/* -ea src/Test.java